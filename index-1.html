<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AVIATOR ZM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:     #090b14;
      --panel:  #0e1120;
      --accent: #e91e63;
      --acc2:   #ff6b35;
      --green:  #00e676;
      --text:   #e8eaf6;
      --muted:  #7986cb;
      --border: #1c2340;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body{
      background:var(--bg);color:var(--text);
      font-family:'Rajdhani',sans-serif;
      height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    }

    /* ── TOPBAR ── */
    #topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 16px;background:var(--panel);
      border-bottom:1px solid var(--border);flex-shrink:0;
    }
    .logo{
      font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:900;
      letter-spacing:4px;display:flex;align-items:center;gap:8px;
      background:linear-gradient(90deg,var(--accent),var(--acc2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .logo svg{flex-shrink:0}
    #conn-badge{
      font-size:0.6rem;letter-spacing:2px;padding:3px 8px;border-radius:10px;
      font-family:'Rajdhani',sans-serif;font-weight:700;
      background:#1a2a10;color:#69f0ae;border:1px solid #2e5c30;
    }
    #conn-badge.offline{background:#2a1010;color:#ef5350;border-color:#5c2e2e;}
    .topright{display:flex;align-items:center;gap:10px}
    #walletBtn{
      background:transparent;border:1px solid var(--border);border-radius:8px;
      color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:700;
      font-size:0.78rem;letter-spacing:1px;padding:6px 11px;cursor:pointer;
      transition:all .15s;
    }
    #walletBtn:hover{border-color:var(--green);color:var(--green)}
    .bal-wrap{text-align:right}
    .bal-lbl{font-size:0.58rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
    .bal-val{font-family:'Orbitron',sans-serif;font-size:.95rem;color:var(--green)}

    /* ── CANVAS AREA ── */
    #game-wrap{
      position:relative;flex:1 1 auto;overflow:hidden;
      background:radial-gradient(ellipse at 50% 110%,#1a0630 0%,var(--bg) 68%);
    }
    canvas{display:block;width:100%;height:100%}
    #stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .star{
      position:absolute;background:#fff;border-radius:50%;
      animation:twinkle var(--d,3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle{from{opacity:.08}to{opacity:.9}}

    #phase-badge{
      position:absolute;top:10px;left:50%;transform:translateX(-50%);
      background:rgba(14,17,32,.88);border:1px solid var(--border);
      border-radius:20px;padding:4px 14px;
      font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
      white-space:nowrap;
    }

    #multiplier{
      position:absolute;top:50%;left:50%;
      transform:translate(-50%,-65%);
      font-family:'Orbitron',sans-serif;
      font-size:clamp(2.6rem,11vw,5.5rem);font-weight:900;color:#fff;
      text-shadow:0 0 40px rgba(233,30,99,.7),0 0 80px rgba(233,30,99,.25);
      pointer-events:none;white-space:nowrap;transition:color .25s;
    }
    #multiplier.crashed{
      color:var(--accent);text-shadow:0 0 50px rgba(233,30,99,1);
      animation:shake .45s ease;
    }
    #multiplier.cashed{color:var(--green);text-shadow:0 0 40px rgba(0,230,118,.8)}
    @keyframes shake{
      0%,100%{transform:translate(-50%,-65%)}
      20%{transform:translate(-52%,-65%)}
      40%{transform:translate(-48%,-65%)}
      60%{transform:translate(-52%,-65%)}
      80%{transform:translate(-49%,-65%)}
    }

    #history{
      position:absolute;bottom:0;left:0;right:0;
      display:flex;gap:5px;padding:5px 8px;
      overflow-x:auto;scrollbar-width:none;
      background:rgba(9,11,20,.55);
    }
    #history::-webkit-scrollbar{display:none}
    .hchip{
      flex:0 0 auto;font-family:'Orbitron',sans-serif;
      font-size:.62rem;padding:3px 7px;border-radius:6px;font-weight:700;
    }
    .hchip.lo{background:#2a0a14;color:#ef5350}
    .hchip.mi{background:#0a2a12;color:#66bb6a}
    .hchip.hi{background:#0a1a3a;color:#42a5f5}

    #cdown{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(9,11,20,.72);font-family:'Orbitron',sans-serif;
      font-size:4rem;font-weight:900;color:#fff;
      pointer-events:none;opacity:0;transition:opacity .3s;
    }
    #cdown.on{opacity:1}

    /* ── BOTTOM PANEL ── */
    #btm{
      background:var(--panel);border-top:1px solid var(--border);
      padding:12px 14px 22px;display:flex;flex-direction:column;gap:10px;
      flex-shrink:0;
    }
    .bet-row{display:flex;align-items:center;gap:8px}
    .bet-row label{font-size:.68rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
    #betInput{
      flex:1;background:var(--bg);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-family:'Orbitron',sans-serif;
      font-size:.95rem;padding:10px 12px;outline:none;text-align:center;
      -moz-appearance:textfield;
    }
    #betInput::-webkit-inner-spin-button,
    #betInput::-webkit-outer-spin-button{-webkit-appearance:none}
    #betInput:focus{border-color:var(--accent)}
    .qbets{display:flex;gap:6px}
    .qb{
      flex:1;background:var(--bg);border:1px solid var(--border);
      border-radius:7px;color:var(--muted);font-family:'Rajdhani',sans-serif;
      font-weight:700;font-size:.82rem;padding:7px 0;cursor:pointer;transition:all .15s;
    }
    .qb:hover{border-color:var(--accent);color:var(--text)}
    #actionBtn{
      width:100%;padding:17px;font-family:'Orbitron',sans-serif;
      font-size:.95rem;font-weight:700;letter-spacing:3px;border:none;
      border-radius:12px;cursor:pointer;transition:all .2s;
    }
    #actionBtn.s-bet{
      background:linear-gradient(135deg,var(--accent),#c2185b);color:#fff;
      box-shadow:0 4px 22px rgba(233,30,99,.4);
    }
    #actionBtn.s-bet:hover{transform:translateY(-1px);box-shadow:0 6px 30px rgba(233,30,99,.6)}
    #actionBtn.s-cash{
      background:linear-gradient(135deg,var(--green),#00c853);color:#000;
      box-shadow:0 4px 22px rgba(0,230,118,.4);
      animation:pg .8s ease-in-out infinite alternate;
    }
    @keyframes pg{
      from{box-shadow:0 4px 20px rgba(0,230,118,.3)}
      to{box-shadow:0 7px 36px rgba(0,230,118,.7)}
    }
    #actionBtn.s-wait{
      background:var(--bg);color:var(--muted);border:1px solid var(--border);cursor:not-allowed;
    }

    /* ── WALLET MODAL ── */
    #modal-ov{
      position:fixed;inset:0;background:rgba(0,0,0,.78);
      display:flex;align-items:flex-end;justify-content:center;
      z-index:500;opacity:0;pointer-events:none;transition:opacity .25s;
    }
    #modal-ov.open{opacity:1;pointer-events:all}
    #wallet-sheet{
      background:var(--panel);border:1px solid var(--border);
      border-radius:22px 22px 0 0;width:100%;max-width:480px;
      padding:22px 18px 34px;
      transform:translateY(100%);transition:transform .3s ease;
    }
    #modal-ov.open #wallet-sheet{transform:translateY(0)}
    .mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .mhdr h2{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:3px}
    #closeModal{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1}

    .bal-card{
      background:var(--bg);border:1px solid var(--border);border-radius:12px;
      padding:13px 15px;margin-bottom:14px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .bc-lbl{font-size:.62rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
    .bc-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;color:var(--green)}
    .bc-cur{font-size:.78rem;color:var(--muted)}

    .tabs{display:flex;gap:0;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:16px}
    .tabs button{
      flex:1;padding:9px;border:none;border-radius:8px;background:none;
      color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:700;
      font-size:.88rem;letter-spacing:2px;cursor:pointer;transition:all .2s;
    }
    .tabs button.on{background:var(--border);color:var(--text)}

    .amt-wrap{position:relative;margin-bottom:8px}
    .pfx{
      position:absolute;left:13px;top:50%;transform:translateY(-50%);
      font-family:'Orbitron',sans-serif;font-size:.88rem;color:var(--muted);pointer-events:none;
    }
    #mAmt{
      width:100%;background:var(--bg);border:1px solid var(--border);
      border-radius:10px;color:var(--text);font-family:'Orbitron',sans-serif;
      font-size:1.05rem;padding:13px 13px 13px 40px;outline:none;
      -moz-appearance:textfield;
    }
    #mAmt::-webkit-inner-spin-button,#mAmt::-webkit-outer-spin-button{-webkit-appearance:none}
    #mAmt:focus{border-color:var(--accent)}
    .min-note{font-size:.68rem;color:var(--muted);margin-bottom:12px;padding-left:2px}

    .qamts{display:flex;gap:7px;margin-bottom:14px}
    .qa{
      flex:1;background:var(--bg);border:1px solid var(--border);
      border-radius:8px;color:var(--muted);font-family:'Rajdhani',sans-serif;
      font-weight:700;font-size:.82rem;padding:8px 0;cursor:pointer;
      transition:all .15s;text-align:center;
    }
    .qa:hover{border-color:var(--green);color:var(--green)}

    #wdraw-fields{display:none;margin-bottom:14px}
    #wdraw-fields.vis{display:block}
    #wdraw-fields select,#wdraw-fields input{
      width:100%;background:var(--bg);border:1px solid var(--border);
      border-radius:10px;color:var(--text);font-family:'Rajdhani',sans-serif;
      font-size:.95rem;padding:12px 13px;outline:none;margin-bottom:9px;
    }
    #wdraw-fields select option{background:var(--panel)}
    #wdraw-fields select:focus,#wdraw-fields input:focus{border-color:var(--accent)}

    #confirmBtn{
      width:100%;padding:15px;font-family:'Orbitron',sans-serif;
      font-size:.9rem;font-weight:700;letter-spacing:3px;border:none;
      border-radius:12px;cursor:pointer;transition:all .2s;
    }
    #confirmBtn.dep{
      background:linear-gradient(135deg,var(--green),#00c853);color:#000;
      box-shadow:0 4px 18px rgba(0,230,118,.3);
    }
    #confirmBtn.wit{
      background:linear-gradient(135deg,#ff6b35,#e64a19);color:#fff;
      box-shadow:0 4px 18px rgba(255,107,53,.3);
    }

    /* tx history */
    #tab-hist{display:none}
    .tx-list{max-height:180px;overflow-y:auto;scrollbar-width:thin}
    .tx-item{
      display:flex;justify-content:space-between;align-items:center;
      padding:9px 0;border-bottom:1px solid var(--border);font-size:.85rem;
    }
    .tx-item:last-child{border-bottom:none}
    .tx-meta{color:var(--muted);font-size:.68rem;letter-spacing:1px}
    .tx-amt{font-family:'Orbitron',sans-serif;font-size:.82rem}
    .tx-amt.d{color:var(--green)}.tx-amt.w{color:#ff6b35}

    /* toast */
    #toast{
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%) scale(.7);
      background:var(--panel);border:2px solid var(--green);
      border-radius:16px;padding:20px 30px;text-align:center;
      opacity:0;pointer-events:none;transition:all .3s;z-index:600;
    }
    #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .tw{font-family:'Orbitron',sans-serif;font-size:1.6rem;color:var(--green)}
    .ta{font-size:.75rem;color:var(--muted);margin-top:5px;letter-spacing:2px}

    /* error toast */
    #err-toast{
      position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
      background:#2a0a14;border:1px solid var(--accent);border-radius:10px;
      padding:10px 18px;font-size:.82rem;color:#ef9a9a;
      opacity:0;pointer-events:none;transition:all .3s;z-index:700;white-space:nowrap;
    }
    #err-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#e91e63">
      <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
    </svg>
    AVIATOR
  </div>
  <div class="topright">
    <span id="conn-badge">ONLINE</span>
    <button id="walletBtn">💳 WALLET</button>
    <div class="bal-wrap">
      <div class="bal-lbl">Balance</div>
      <div class="bal-val">K<span id="bal-disp">0.00</span></div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game-wrap">
  <div id="stars"></div>
  <canvas id="gc"></canvas>
  <div id="phase-badge">WAITING FOR NEXT ROUND</div>
  <div id="multiplier">1.00x</div>
  <div id="history"></div>
  <div id="cdown"></div>
</div>

<!-- BOTTOM -->
<div id="btm">
  <div class="bet-row">
    <label>BET K</label>
    <input id="betInput" type="number" value="0.50" min="0.50" step="0.50" max="50000"/>
  </div>
  <div class="qbets">
    <button class="qb" data-a="0.50">K0.50</button>
    <button class="qb" data-a="2">K2</button>
    <button class="qb" data-a="5">K5</button>
    <button class="qb" data-a="10">K10</button>
  </div>
  <button id="actionBtn" class="s-bet">PLACE BET</button>
</div>

<!-- WALLET MODAL -->
<div id="modal-ov">
  <div id="wallet-sheet">
    <div class="mhdr">
      <h2>WALLET</h2>
      <button id="closeModal">✕</button>
    </div>

    <div class="bal-card">
      <div>
        <div class="bc-lbl">Available Balance</div>
        <div class="bc-val">K<span id="m-bal">0.00</span></div>
      </div>
      <div class="bc-cur">Zambian Kwacha (ZMW)</div>
    </div>

    <div class="tabs">
      <button id="tDep" class="on">DEPOSIT</button>
      <button id="tWit">WITHDRAW</button>
      <button id="tHist">HISTORY</button>
    </div>

    <!-- FORM tab -->
    <div id="tab-form">
      <div class="amt-wrap">
        <span class="pfx">K</span>
        <input id="mAmt" type="number" placeholder="0.00" min="0.50" step="0.50"/>
      </div>
      <div class="min-note">Minimum: K0.50</div>
      <div class="qamts">
        <div class="qa" data-qa="10">K10</div>
        <div class="qa" data-qa="20">K20</div>
        <div class="qa" data-qa="50">K50</div>
        <div class="qa" data-qa="100">K100</div>
      </div>

      <div id="wdraw-fields">
        <select id="wMethod">
          <option value="">Select payment method…</option>
          <option value="airtel">Airtel Money</option>
          <option value="mtn">MTN Mobile Money</option>
          <option value="zanaco">Zanaco Bank Transfer</option>
          <option value="fnb">FNB Zambia</option>
          <option value="stanbic">Stanbic Bank</option>
        </select>
        <input id="wAccount" type="text" placeholder="Mobile / account number"/>
      </div>

      <button id="confirmBtn" class="dep">DEPOSIT FUNDS</button>
    </div>

    <!-- HISTORY tab -->
    <div id="tab-hist">
      <div class="tx-list" id="txList">
        <div style="color:var(--muted);font-size:.85rem;text-align:center;padding:24px 0">No transactions yet</div>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div id="toast"><div class="tw" id="t-amt"></div><div class="ta">CASHED OUT ✓</div></div>
<div id="err-toast" id="err-t"></div>

<!-- Firebase -->

  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    storageBucket:"aviatorgame-18041.firebasestorage.app",

<script src="game.js"></script>
</body>
</html>
